<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevSide Quiz — Descubra o lado da tecnologia que mais combina com você e revele seu Avatar RPG.">
    <title>DevSide — Descubra seu Lado Dev</title>

    <!-- Tipografia Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (Apenas Ícones Vetoriais, Zero Framework CSS/JS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Arquitetura CSS Modular do DevSide -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <main class="app-shell">
        <!-- Cabeçalho Semântico -->
        <header class="hero-header">
            <div class="hero-header__badge">
                <i class="bi bi-terminal-fill" aria-hidden="true"></i>
                <span>DevSide | Seu lado DEV</span>
            </div>
            <h1 class="hero-header__title">Bem-vindo ao DevSide!</h1>
            <p class="hero-header__subtitle">
                Descubra o lado da Fatec Jales que mais combina com você.
            </p>
            <div class="hero-header__divider" aria-hidden="true"></div>
        </header>

        <!-- HUD de Progresso do Quiz (60fps scaleX) -->
        <section class="quiz-hud" id="quizHud" aria-label="Progresso do Quiz">
            <div class="quiz-hud__meta">
                <span id="hudStepLabel">Criação de Personagem</span>
                <span class="quiz-hud__step-badge" id="hudStepBadge">
                    <i class="bi bi-person-badge" aria-hidden="true"></i>
                    Etapa Inicial
                </span>
            </div>
            <div
                class="quiz-hud__track"
                id="hudProgressTrack"
                role="progressbar"
                aria-label="Progresso das etapas"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="9"
            >
                <div class="quiz-hud__bar" id="hudProgressBar"></div>
            </div>
        </section>

        <!-- Palco Dinâmico do Quiz (Renderizado via DocumentFragment + WAAPI) -->
        <section id="quizSection" aria-live="polite">
            <article class="quiz-card" id="quizStage"></article>
        </section>

        <!-- Seção de Resultado RPG (Revelada ao concluir) -->
        <section id="resultado" aria-live="polite" hidden></section>
    </main>

    <!-- Aplicação Modular ES6+ -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
