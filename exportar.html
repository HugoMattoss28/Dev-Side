<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSide — Exportar Alunos (Supabase)</title>

    <!-- Tipografia Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Arquitetura CSS Modular do DevSide -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <main class="app-shell">
        <header class="hero-header">
            <div class="hero-header__badge">
                <i class="bi bi-database-check" aria-hidden="true"></i>
                <span>DevSide | Banco de Dados Etec</span>
            </div>
            <h1 class="hero-header__title">Exportar Alunos</h1>
            <p class="hero-header__subtitle" id="totalContatos">
                Conectando ao banco Supabase...
            </p>
            <div class="hero-header__divider" aria-hidden="true"></div>
        </header>

        <section class="quiz-card" style="max-width: 560px; margin-inline: auto; text-align: center;">
            <p class="winner-banner__desc" style="margin-bottom: var(--space-6);">
                Baixe os registros de todos os alunos (`id`, `nome`, `celular`, `email`, `idade`, `area_vencedora`) salvos no banco de dados.
            </p>

            <div style="display: flex; flex-direction: column; gap: var(--space-3);">
                <button type="button" class="btn-action" id="btnBaixarCsv" disabled>
                    <i class="bi bi-file-earmark-spreadsheet-fill" aria-hidden="true"></i>
                    <span>Baixar Planilha (.csv para Excel)</span>
                </button>

                <button type="button" class="btn-action btn-action--secondary" id="btnBaixarJson" disabled>
                    <i class="bi bi-filetype-json" aria-hidden="true"></i>
                    <span>Baixar em JSON (.txt)</span>
                </button>
            </div>
        </section>
    </main>

    <script type="module">
        import { fetchAllStudents } from "./js/services/storageService.js";
        import { animateInvalidShake } from "./js/ui/motionController.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const totalEl = document.getElementById("totalContatos");
            const btnCsv = document.getElementById("btnBaixarCsv");
            const btnJson = document.getElementById("btnBaixarJson");

            const { source, data: students } = await fetchAllStudents();

            if (totalEl) {
                const originLabel = source === "supabase" ? "no Supabase" : "neste navegador (modo local)";
                totalEl.textContent = `${students.length} aluno(s) registrado(s) ${originLabel}`;
            }

            if (students.length > 0) {
                if (btnCsv) btnCsv.disabled = false;
                if (btnJson) btnJson.disabled = false;
            }

            const triggerDownload = (content, filename, mimeType) => {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            };

            btnCsv?.addEventListener("click", () => {
                if (students.length === 0) {
                    animateInvalidShake(btnCsv);
                    return;
                }

                const headers = ["id", "nome", "celular", "email", "idade", "area_vencedora"];
                const csvRows = [
                    headers.join(";"),
                    ...students.map((row, idx) =>
                        [
                            row.id ?? idx + 1,
                            `"${String(row.nome ?? "").replace(/"/g, '""')}"`,
                            `"${String(row.celular ?? "").replace(/"/g, '""')}"`,
                            `"${String(row.email ?? "").replace(/"/g, '""')}"`,
                            row.idade ?? "",
                            `"${String(row.area_vencedora ?? "").replace(/"/g, '""')}"`
                        ].join(";")
                    )
                ];

                // BOM (\uFEFF) garante que o Excel abra acentos em UTF-8 corretamente
                triggerDownload("\uFEFF" + csvRows.join("\r\n"), "alunos-devside.csv", "text/csv;charset=utf-8");
            });

            btnJson?.addEventListener("click", () => {
                if (students.length === 0) {
                    animateInvalidShake(btnJson);
                    return;
                }

                const content = JSON.stringify(students, null, 2);
                triggerDownload(content, "alunos-devside.txt", "text/plain;charset=utf-8");
            });
        });
    </script>
</body>

</html>
