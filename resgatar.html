<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resgate seu Card Colecionável DevSide — Seja Fatec diretamente no seu celular.">
    <title>DevSide — Meu Card Seja Fatec</title>

    <!-- Tipografia Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Arquitetura CSS Modular do DevSide -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <main class="app-shell" style="max-width: 460px;">
        <header class="hero-header">
            <div class="hero-header__badge">
                <i class="bi bi-stars" aria-hidden="true"></i>
                <span>DevSide | Seja Fatec</span>
            </div>
            <h1 class="hero-header__title" style="font-size: clamp(1.75rem, 6vw, 2.25rem);">
                Seu Card Colecionável
            </h1>
            <p class="hero-header__subtitle" id="rescueClassSubtitle">
                Gerando seu card exclusivo...
            </p>
            <div class="hero-header__divider" aria-hidden="true"></div>
        </header>

        <section class="rpg-panel avatar-showcase" id="rescueCard">
            <div class="reflective-card" id="rescueReflectiveCard">
                <img
                    class="reflective-card__img"
                    id="rescueCardImg"
                    alt="Card Colecionável DevSide — Seja Fatec"
                >
                <div class="reflective-card__sheen" aria-hidden="true"></div>
                <div class="reflective-card__glare" aria-hidden="true"></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-6);">
                <button type="button" class="btn-action" id="btnMobileDownload" disabled>
                    <i class="bi bi-download" aria-hidden="true"></i>
                    <span>Baixar Card no Celular</span>
                </button>

                <button type="button" class="btn-action btn-action--secondary" id="btnMobileShare" hidden>
                    <i class="bi bi-share-fill" aria-hidden="true"></i>
                    <span>Compartilhar (WhatsApp / Stories)</span>
                </button>
            </div>

            <p class="field__hint" style="margin-top: var(--space-4);">
                Dica: toque e arraste o dedo sobre o card para ver o efeito holográfico 3D! No iPhone, você também pode segurar o dedo no card e tocar em <strong>"Salvar em Fotos"</strong>.
            </p>
        </section>
    </main>

    <script type="module">
        import { RPG_CLASSES } from "./js/config/quizData.js";
        import {
            buildAvatarPathsFromParams,
            renderCollectibleAvatarCard,
            formatAvatarDownloadFilename
        } from "./js/services/avatarService.js";
        import {
            animateResultReveal,
            attachReflectiveCardEffect
        } from "./js/ui/motionController.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);

            const areaKey = params.get("a") || "";
            const genderFolder = params.get("g") || "";
            const skinFolder = params.get("s") || "";
            const spriteNumber = Number(params.get("n") || 0);

            // Sanitização estrita do apelido (Prevenção contra XSS)
            const rawNick = params.get("nick") || "Aventureiro";
            const safeNickname = rawNick.trim().replace(/[<>"]/g, "").slice(0, 24) || "Aventureiro";

            const subtitleEl = document.getElementById("rescueClassSubtitle");
            const reflectiveCard = document.getElementById("rescueReflectiveCard");
            const cardImg = document.getElementById("rescueCardImg");
            const downloadBtn = document.getElementById("btnMobileDownload");
            const shareBtn = document.getElementById("btnMobileShare");
            const rescueCard = document.getElementById("rescueCard");

            const avatar = buildAvatarPathsFromParams(areaKey, genderFolder, skinFolder, spriteNumber);

            if (!avatar || !reflectiveCard || !cardImg) {
                if (subtitleEl) subtitleEl.textContent = "Link de card inválido ou incompleto.";
                return;
            }

            const track = RPG_CLASSES[areaKey]?.track;
            if (track) {
                document.documentElement.dataset.track = track;
            }

            if (subtitleEl) {
                subtitleEl.textContent = `Parabéns, ${safeNickname}! Você desbloqueou a classe ${avatar.areaName}.`;
            }

            attachReflectiveCardEffect(reflectiveCard);
            animateResultReveal(rescueCard);

            let generatedBlob = null;
            let generatedDataUrl = "";
            const filename = formatAvatarDownloadFilename(safeNickname, avatar.areaName);

            try {
                const { dataUrl, blob } = await renderCollectibleAvatarCard({
                    avatar,
                    nickname: safeNickname
                });

                generatedDataUrl = dataUrl;
                generatedBlob = blob;

                cardImg.src = dataUrl;
                cardImg.alt = `Card Seja Fatec de ${safeNickname} — Classe ${avatar.areaName}`;

                if (downloadBtn) {
                    downloadBtn.disabled = false;
                }
            } catch {
                if (subtitleEl) {
                    subtitleEl.textContent = "Não foi possível renderizar a imagem do seu card.";
                }
                return;
            }

            // Download direto da imagem composta (Card + Avatar + Apelido + Seja Fatec)
            downloadBtn?.addEventListener("click", () => {
                if (generatedBlob) {
                    const blobUrl = URL.createObjectURL(generatedBlob);
                    const link = document.createElement("a");
                    link.href = blobUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
                    return;
                }

                if (generatedDataUrl) {
                    const link = document.createElement("a");
                    link.href = generatedDataUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                }
            });

            // Compartilhamento nativo da imagem composta via Web Share API (WhatsApp / Stories)
            if (typeof navigator.share === "function" && shareBtn && generatedBlob) {
                shareBtn.hidden = false;
                shareBtn.addEventListener("click", async () => {
                    try {
                        const file = new File([generatedBlob], filename, { type: "image/png" });

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: `Meu Card DevSide — Seja Fatec (${avatar.areaName})`,
                                text: `Eu fui no Seja Fatec e descobri minha classe no DevSide: ${avatar.areaName}!`,
                                files: [file]
                            });
                            return;
                        }

                        await navigator.share({
                            title: `Meu Card DevSide — Seja Fatec (${avatar.areaName})`,
                            text: `Eu fui no Seja Fatec e descobri minha classe no DevSide: ${avatar.areaName}!`,
                            url: window.location.href
                        });
                    } catch {
                        // Cancelamento pelo usuário não é erro
                    }
                });
            }
        });
    </script>
</body>

</html>
